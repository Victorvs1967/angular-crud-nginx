<div class="container">
  <h2 class="mt-3 md-3">Edit Product</h2>
    <form action="">
      <div class="mb-3">
        <label for="productName" class="form-label">Product Name</label>
        <input 
          type="text" 
          class="form-control" 
          name="name" 
          placeholder="Enter product name" 
          required="required" 
        />
      </div>
      <div class="mb-3">
        <label for="productPrice" class="form-label">Product Price</label>
        <input 
          type="number" 
          class="form-control" 
          name="price" 
          placeholder="Enter product price" 
          required="required" 
        />
      </div>
      <div class="mb-3">
        <label for="productDescription" class="form-label">Product Description</label>
        <textarea 
          class="form-control" 
          id="productDescription" 
          [(ngModel)]="newProductForm.description"
        >
        </textarea>
      </div>
      <div class="mb-3">
        <label for="productUrl" class="form-label">Product URL</label>
        <input 
          type="text" 
          class="form-control" 
          name="url" 
          placeholder="Enter product URL" 
          required="required" 
        />
      </div>
      <div class="mb-3">
        <label for="productName" class="form-label">Product Name</label>
        <input 
          type="text" 
          class="form-control" 
          name="name" 
          placeholder="Enter product name" 
          required="required" 
        />
      </div>
      <button type="button" class="btn btn-primary" (click)="updateProduct()">
        Update Product
      </button>
    </form>
</div>
