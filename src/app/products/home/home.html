<div class="container">
  <table class="table">
    <thead>
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Name</th>
        <th scope="col">Price</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (item of products; track $index) {
        <tr>
          <th scope="row">{{ item.id }}</th>
          <td>{{ item.name }}</td>
          <td>{{ item.price | currency: "USD" }}</td>
          <td>
            <a [routerLink]="['/products/edit', item.id]" class="btn btn-secondary">Edit</a>
            <button type="button" (click)="deleteProduct(item.id)" class="btn btn-danger mx-3">Remove</button>
          </td>
        </tr>
      }
     </tbody>
  </table>
  <div class="mx-3">
    <a routerLink="/products/create" class="btn btn-primary me-5 px-4">Add Product</a>
  </div>
</div>
